services:
  # ==========================================
  # BANCO DE DADOS POSTGRESQL (Multi-Database)
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: syndetis_postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_MULTIPLE_DATABASES: "syndetis_auth,syndetis_core"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    networks:
      - syndetis_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # CACHE & MENSAGERIA LEVE (REDIS)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: syndetis_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - syndetis_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  syndetis_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
