spring.application.name=core-service
server.port=${CORE_SERVICE_PORT:8082}
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/syndetis_core
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
management.endpoints.web.exposure.include=health
springdoc.swagger-ui.path=/swagger-ui.html
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
core.jwt.issuer=${JWT_ISSUER:http://localhost:8081}
core.jwt.audience=${JWT_AUDIENCE:syndetis}
core.order.reservation-ttl-minutes=${ORDER_RESERVATION_TTL_MINUTES:30}

# Redis e Publicação de Eventos
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
core.events.enabled=${CORE_EVENTS_ENABLED:true}
core.events.stream=${CORE_EVENTS_STREAM:syndetis:core-events}
