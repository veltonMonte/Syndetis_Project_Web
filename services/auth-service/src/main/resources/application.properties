spring.application.name=auth-service
server.port=8081

# ==========================================
# CONEXÃO COM O POSTGRESQL LOCAL
# ==========================================
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/syndetis_auth
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================
# FLYWAY (MIGRATIONS)
# ==========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ==========================================
# CONFIGURAÇÕES DE JWT (RS256) E JWKS
# ==========================================
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.issuer=${JWT_ISSUER:http://localhost:8081}
jwt.audience=${JWT_AUDIENCE:syndetis}
jwt.rsa.key-id=${JWT_RSA_KEY_ID:auth-key-1}
jwt.rsa.private-key-path=${JWT_RSA_PRIVATE_KEY_PATH:}
jwt.rsa.private-key-value=${JWT_RSA_PRIVATE_KEY_VALUE:}
jwt.rsa.previous-public-key-value=${JWT_RSA_PREVIOUS_PUBLIC_KEY_VALUE:}
jwt.rsa.previous-public-key-path=${JWT_RSA_PREVIOUS_PUBLIC_KEY_PATH:}
jwt.rsa.previous-key-id=${JWT_RSA_PREVIOUS_KEY_ID:auth-key-old}

