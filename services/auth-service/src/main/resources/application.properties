spring.application.name=auth-service
server.port=8081

# ==========================================
# CONEXÃO COM O POSTGRESQL LOCAL
# ==========================================
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/syndetis_auth
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
# DATABASE_URL (postgresql://user:pass@host/db?sslmode=require), when set, replaces the three lines
# above: see DatabaseUrlEnvironmentPostProcessor. Pool sized for Neon, which suspends idle computes:
# a longer connection timeout covers its cold start, and idle connections are retired before Neon
# closes them.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:15000}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================
# FLYWAY (MIGRATIONS)
# ==========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.session.jdbc.initialize-schema=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ==========================================
# CONFIGURAÇÕES DE JWT (RS256) E JWKS
# ==========================================
jwt.expiration=${JWT_EXPIRATION:600000}
auth.refresh-token.ttl-days=${REFRESH_TOKEN_TTL_DAYS:30}
auth.oauth2.frontend-callback=${AUTH_OAUTH2_FRONTEND_CALLBACK:http://localhost:5173/auth/callback}
jwt.issuer=${JWT_ISSUER:http://localhost:8081}
jwt.audience=${JWT_AUDIENCE:syndetis}
jwt.rsa.key-id=${JWT_RSA_KEY_ID:auth-key-1}
jwt.rsa.private-key-path=${JWT_RSA_PRIVATE_KEY_PATH:}
jwt.rsa.private-key-value=${JWT_RSA_PRIVATE_KEY_VALUE:}
jwt.rsa.previous-public-key-value=${JWT_RSA_PREVIOUS_PUBLIC_KEY_VALUE:}
jwt.rsa.previous-public-key-path=${JWT_RSA_PREVIOUS_PUBLIC_KEY_PATH:}
jwt.rsa.previous-key-id=${JWT_RSA_PREVIOUS_KEY_ID:auth-key-old}


# ==========================================
# CPF/CNPJ DOS LOJISTAS (RECEITA FEDERAL VIA INTEGRATION-HUB)
# ==========================================
auth.tax-id.hub-url=${INTEGRATION_HUB_URL:http://localhost:3001}
auth.tax-id.internal-token=${TAX_ID_INTERNAL_TOKEN:}
# Chave do HMAC que identifica um CPF/CNPJ sem guardá-lo; troque em produção e nunca a altere depois.
auth.tax-id.hash-key=${DOCUMENT_HASH_KEY:syndetis-local-document-key}
