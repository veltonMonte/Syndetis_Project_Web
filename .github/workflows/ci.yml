name: CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # FRONTEND (React SPA)
  # ==========================================
  frontend:
    name: Frontend (Lint & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Build project
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser journeys
        run: npm run test:e2e

  gateway:
    name: Gateway (Build & HTTP Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - run: npm ci
      - run: npm test

  integration-hub:
    name: Integration Hub (Build & Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/integration-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/integration-hub/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build

  checkout-smoke:
    name: Checkout through Gateway (Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AUTH_SPRING_PROFILES_ACTIVE: homologation
      HOMOLOGATION_SELLER_EMAIL: seller@example.test
      HOMOLOGATION_SELLER_PASSWORD: CiOnly-Seller-Password123!
      PUBLIC_ORIGIN: http://localhost:8080
      JWT_ISSUER: http://localhost:8080
      PAYMENTS_ENABLED: "true"
      PAYMENTS_INTERNAL_TOKEN: ci-only-internal-token-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate smoke HTTP responses
        run: node --test scripts/http-response.test.mjs
      - name: Start isolated services
        run: docker compose -p syndetis-ci --env-file .env.example up -d --build
      - name: Exercise real services through gateway
        run: node scripts/smoke-checkout.mjs
      - name: Service diagnostics
        if: failure()
        run: docker compose -p syndetis-ci logs --tail=100
      - name: Stop isolated test stack
        if: always()
        run: docker compose -p syndetis-ci down -v

  # ==========================================
  # AUTH SERVICE (Kotlin / Spring Boot)
  # ==========================================
  auth-service:
    name: Backend (Build & Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/auth-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Build & Test with Maven
        run: ./mvnw -B test

  core-service:
    name: Core Service (Build & Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/core-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: ./services/core-service/pom.xml

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Build and test
        run: ./mvnw -B test

  auth-image:
    name: Auth Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - name: Start auth-service with PostgreSQL
        run: docker compose --env-file .env.example up -d --build postgres auth-service
      - name: Check JWKS readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8081/.well-known/jwks.json | grep -q '"keys"'; then
              exit 0
            fi
            sleep 2
          done
          docker compose --env-file .env.example logs auth-service
          exit 1
      - name: Stop smoke-test containers
        if: always()
        run: docker compose --env-file .env.example down -v
