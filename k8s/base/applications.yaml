apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 2
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 600
  minReadySeconds: 5
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: auth-service}
  template:
    metadata:
      labels: {app: auth-service}
    spec:
      terminationGracePeriodSeconds: 40
      containers:
        - name: auth-service
          image: syndetis-local/auth-service:dev
          imagePullPolicy: Never
          # The key is generated once and mounted read-only, shared by all replicas.
          # Bypass the Docker entrypoint which generates a per-container key.
          command: [java, '-XX:MaxRAMPercentage=65', -jar, /app/app.jar]
          ports: [{name: http, containerPort: 8081}]
          envFrom:
            - configMapRef: {name: syndetis-config}
            - secretRef: {name: syndetis-database}
            - secretRef: {name: syndetis-test-seller}
          env:
            - {name: SPRING_PROFILES_ACTIVE, value: 'kubernetes,homologation'}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '1', memory: 768Mi}
          startupProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: jwt-key, mountPath: /app/keys, readOnly: true}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: jwt-key
          secret:
            secretName: syndetis-auth-key
            defaultMode: 288
---
