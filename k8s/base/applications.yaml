apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  # In-memory rate limiting is per-process. Keep one replica until its store is shared.
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels: {app: gateway}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: gateway
          image: syndetis-local/gateway:dev
          imagePullPolicy: Never
          ports: [{name: http, containerPort: 8080}]
          envFrom: [{configMapRef: {name: syndetis-config}}]
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 500m, memory: 192Mi}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: integration-hub
spec:
  # Fixed consumer identity + no overlapping workers preserve pending stream entries.
  # Scale only after implementing XAUTOCLAIM for abandoned consumers.
  replicas: 1
  revisionHistoryLimit: 2
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: integration-hub}
  template:
    metadata:
      labels: {app: integration-hub}
    spec:
      hostname: integration-hub-local
      terminationGracePeriodSeconds: 40
      containers:
        - name: integration-hub
          image: syndetis-local/integration-hub:dev
          imagePullPolicy: Never
          ports: [{name: http, containerPort: 3001}]
          envFrom: [{configMapRef: {name: syndetis-config}}]
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes:
        - name: tmp
          emptyDir: {}
