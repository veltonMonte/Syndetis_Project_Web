apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{name: postgres, containerPort: 5432}]
          envFrom: [{secretRef: {name: syndetis-database}}]
          env:
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi}
          startupProbe:
            exec:
              command: [sh, -c, 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d syndetis_core']
            periodSeconds: 3
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d syndetis_core']
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [sh, -c, 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d postgres']
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: socket, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
      volumes:
        - {name: socket, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
        - name: init
          configMap:
            name: postgres-init
            defaultMode: 365
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 2Gi}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: redis
          image: redis:7-alpine
          args: [redis-server, --appendonly, 'yes', --appendfsync, everysec, --maxmemory, 128mb, --maxmemory-policy, noeviction]
          ports: [{name: redis, containerPort: 6379}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 500m, memory: 256Mi}
          startupProbe:
            exec: {command: [redis-cli, ping]}
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe:
            exec: {command: [redis-cli, ping]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: [redis-cli, ping]}
            periodSeconds: 10
          volumeMounts: [{name: data, mountPath: /data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 1Gi}
